<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workshop links handout</title>
<style>
	@page { size: letter; margin: 0.4in; }
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font-family: "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
		color: #241814;
	}
	.card {
		width: max-content;
		padding: 0.16in;
		border: 4px solid #361f16;
	}
	h1 {
		margin: 0 0 0.04in;
		color: #361f16;
		font-family: Georgia, "Times New Roman", serif;
		font-size: 10.5pt;
		font-weight: 600;
		line-height: 1.25;
	}
	dl {
		margin: 0;
	}
	dt {
		margin-top: 0.07in;
		font-size: 8pt;
		font-weight: 700;
		color: #6d5a50;
		text-transform: uppercase;
		letter-spacing: 0.04em;
	}
	dd {
		margin: 0;
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		font-size: 12pt;
		font-weight: 600;
		white-space: nowrap;
	}
	.later {
		margin-top: 0.12in;
		padding-top: 0.08in;
		border-top: 1px dashed #d5a23f;
	}
	.later h2 {
		margin: 0;
		color: #5a3525;
		font-size: 10pt;
		font-weight: 700;
	}
</style>
</head>
<body>
<div class="card">
	<h1>Building a developer knowledge base<br>for GitHub Copilot</h1>
	<dl>
		<dt>Instructions</dt><dd>tinyurl.com/ghu-kb-workshop</dd>
		<dt>Slides</dt><dd>tinyurl.com/ghu-kb-slides</dd>
	</dl>
	<div class="later">
		<h2>For exercises 3 + 4 only</h2>
		<dl>
			<dt>Portal</dt><dd>tinyurl.com/ghu-kb-portal</dd>
			<dt>Secrets</dt><dd>tinyurl.com/ghu-kb-secrets</dd>
		</dl>
	</div>
</div>
</body>
</html>
